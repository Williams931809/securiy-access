<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Visitor Code · H Access</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#123047;font-family:system-ui,-apple-system,sans-serif;padding:24px 16px}.wrap{max-width:440px;margin:20px auto}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:.5px}.brand img{width:43px;height:43px}.card{background:white;border:1px solid #dce4ed;border-radius:24px;padding:26px 22px;box-shadow:0 15px 50px #19334b12;margin-top:25px;text-align:center}.eyebrow{font-size:11px;letter-spacing:2px;color:#a7772c;font-weight:800}h1{font-size:26px;line-height:1.15;margin:12px 0 10px}.sub{color:#5e7282;font-size:14px;line-height:1.5}.pin{font-size:36px;font-weight:850;letter-spacing:6px;color:#9d6b23;background:#fff5e5;border:1px solid #f1dfbd;padding:15px 5px;border-radius:16px;margin:18px 0}canvas{max-width:100%;margin:5px auto 12px}.detail{text-align:left;border-top:1px solid #e4eaf0;padding:14px 0;font-size:13px;line-height:1.6}.detail b{display:block;color:#233b4d;margin-bottom:2px}.detail span{color:#5e7282}button{background:#d4a65a;color:#122a3e;border:0;padding:14px 18px;border-radius:14px;font-weight:800;font-size:14px;width:100%;cursor:pointer}.foot{text-align:center;color:#718291;font-size:12px;margin-top:18px}.error{color:#a32929} .brand .officialLogo{width:min(100%,260px);height:auto;max-height:150px;object-fit:contain;object-position:left center}.brand{width:100%}</style></head><body><div class="wrap"><div class="brand"><img src="/h-access-logo.svg" alt="H Access" class="officialLogo"></div><div class="card"><div class="eyebrow">YOUR VISITOR PASS</div><h1 id="heading">Loading invitation…</h1><p class="sub">Show this QR code or your six-digit PIN to security at the gate.</p><div class="pin" id="pin">••••••</div><canvas id="qr" aria-label="Visitor QR code"></canvas><div class="detail"><b>Valid from</b><span id="start">—</span></div><div class="detail"><b>Valid until</b><span id="end">—</span></div><div class="detail"><b>Residence</b><span id="property">—</span></div><button id="copy">Copy six-digit access code</button><p class="sub" id="status">Security will verify this pass at entry. This page does not grant entry by itself.</p></div><p class="foot">H Access · Smart Residential Access</p></div><script type="module">import QRCode from 'https://esm.sh/qrcode@1.5.4';import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';const el=id=>document.getElementById(id);const alias=location.hash.slice(1);const fail=(message)=>{el('heading').textContent='Pass unavailable';el('status').textContent=message;el('status').className='sub error';el('pin').hidden=true;el('copy').hidden=true};const fmt=d=>new Date(d).toLocaleString('en-GB',{timeZone:'Africa/Lagos',day:'2-digit',month:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true});if(!/^[a-f0-9]{12}$/.test(alias)){fail('This invitation link is invalid. Ask your host to resend it.')}else{try{const s=createClient('https://xycuhwmzcjhskauptoaa.supabase.co','sb_publishable_YFbF8N7k4B0HrdkVoldpwg_DTh80L71');const{data,error}=await s.rpc('lookup_invitation',{p_alias:alias});if(error)throw error;if(!data||data.revoked)throw Error('This invitation is unavailable or has been cancelled.');el('heading').textContent='Hi '+String(data.guest||'Visitor').split(/\s+/)[0]+', welcome!';el('pin').textContent=data.pin;el('start').textContent=fmt(data.start);el('end').textContent=fmt(data.end);el('property').textContent=data.property||'H Access residence';await QRCode.toCanvas(el('qr'),data.code,{width:240,margin:2,color:{dark:'#123047',light:'#ffffff'}});el('copy').onclick=()=>navigator.clipboard.writeText(data.pin).then(()=>el('copy').textContent='Copied!');if(Date.now()>Date.parse(data.end)){el('status').textContent='This pass has expired.';el('status').className='sub error'}else if(Date.now()<Date.parse(data.start)){el('status').textContent='This pass becomes valid at the scheduled start time.'}}catch(e){fail(e.message)}}</script></body></html>
